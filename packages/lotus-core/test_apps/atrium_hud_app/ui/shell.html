<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrium Shell</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
      color: #e2e8f0;
      pointer-events: none; /* pane is only the top strip; still need buttons clickable */
    }
    .bar {
      position: absolute;
      top: 0;
      right: 0;
      left: 0;
      height: 56px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: linear-gradient(180deg, rgba(8,12,20,0.72), rgba(8,12,20,0.25));
      pointer-events: auto;
    }
    .btn {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.35);
      color: #f1f5f9;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      pointer-events: auto;
    }
    .btn:hover { border-color: #38bdf8; background: rgba(56, 189, 248, 0.22); }
    .btn.active { border-color: #4ade80; color: #4ade80; }
    body.game-mode .bar { opacity: 0.4; }
  </style>
</head>
<body class="game-mode">
  <div class="bar" id="bar"></div>
  <script>
    const bar = document.getElementById('bar');
    let mode = 'game';
    let buttons = [];

    function lotusIpc() {
      return window.lotus?.ipc || window.lotus || null;
    }

    function render() {
      bar.innerHTML = '';
      for (const b of buttons) {
        const el = document.createElement('button');
        el.type = 'button';
        el.className = 'btn';
        el.dataset.id = b.id;
        el.textContent = b.label || b.id;
        if (b.id === 'mode' || b.id === 'shell:mode') {
          el.textContent = mode === 'game' ? 'Game · F12' : 'Overlay · F12';
          el.classList.toggle('active', mode !== 'game');
        }
        el.addEventListener('click', (ev) => {
          ev.preventDefault();
          ev.stopPropagation();
          const ipc = lotusIpc();
          if (ipc?.send) ipc.send('atrium-shell-button', b.id);
        });
        bar.appendChild(el);
      }
      document.body.classList.toggle('game-mode', mode === 'game');
    }

    window.addEventListener('atrium-shell-chrome', (e) => {
      const d = e.detail || {};
      if (d.mode) mode = d.mode;
      if (Array.isArray(d.buttons)) buttons = d.buttons;
      render();
    });

    const eventSource = window.lotus?.on ? window.lotus
      : (window.lotus?.ipc?.on ? window.lotus.ipc : null);
    if (eventSource) {
      eventSource.on('atrium-game-stats', (stats) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-forward-stats', stats);
      });
      // Host dbus bridge pushes atrium-notify to renderer sockets; Node's
      // shell.notify bus only hears ipcMain — forward like game-stats.
      eventSource.on('atrium-notify', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify', payload || {});
      });
      eventSource.on('atrium-notify-closed', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify-closed', payload || {});
      });
      eventSource.on('atrium-notify-action', (payload) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-notify-action', payload || {});
      });
      eventSource.on('nest:hotkey', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('nest-hotkey', data || {});
      });
      eventSource.on('nest:game-mode', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send) ipc.send('atrium-forward-mode', data);
        if (data && data.game_mode !== undefined) {
          mode = data.game_mode ? 'game' : 'overlay';
          render();
        }
      });
      eventSource.on('nest:fullscreen', (data) => {
        const ipc = lotusIpc();
        if (ipc?.send && data && data.fullscreen !== undefined) {
          ipc.send('atrium-forward-fullscreen', !!data.fullscreen);
        }
      });
    }

    try {
      const ipc = lotusIpc();
      if (ipc && typeof ipc._connectWs === 'function') ipc._connectWs();
    } catch (e) {}
  </script>
</body>
</html>
