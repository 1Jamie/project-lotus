<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0; width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      pointer-events: none;
    }
    .xh {
      position: absolute;
      left: 50%; top: 50%;
      width: 18px; height: 18px;
      transform: translate(-50%, -50%);
    }
    .xh::before, .xh::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.85);
      box-shadow: 0 0 2px rgba(0,0,0,0.8);
    }
    .xh::before { left: 8px; top: 0; width: 2px; height: 18px; }
    .xh::after { left: 0; top: 8px; width: 18px; height: 2px; }
  </style>
</head>
<body>
  <div class="xh" aria-hidden="true"></div>
  <script>
    function centerInWindow() {
      // Pane is small; shell will place it — host may reposition on resize via profile later.
    }
    centerInWindow();
  </script>
</body>
</html>
