[package]
name = "lotus"
version = "0.4.0"
edition = "2021"
exclude = ["servo/**"]

build = "build.rs"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
winit = { version = "0.30" }
euclid = "0.22"

# Cross-platform dependencies
aes-gcm = "0.10"
memmap2 = "0.9"
lru = "0.12"
object = "0.36"
dpi = "0.1"
crossbeam-channel = "0.5"
url = "2.5"
env_logger = "0.11.8"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
rmp-serde = "1.3.1"
rmpv = { version = "1.3", features = ["with-serde"] }
byteorder = "1.5.0"
uuid = { version = "1.20.0", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
glow = "0.17"
gleam = "0.15"
surfman = "0.14.0"
futures-util = "0.3"
dashmap = "5"
bytemuck = "1.16"
urlencoding = "2.1.3"
once_cell = "1.19"
dirs = "5.0"
mime_guess = "2.0.5"
http = "1.4.0"
window-vibrancy = "0.5"
dark-light = "1.0"

# Servo must use one canonical crates.io source for all targets (Cargo requirement).
# Linux builds redirect it to the patched submodule via [patch.crates-io] (injected by
# scripts/apply-servo-patch.sh). Windows/other hosts stay on stock crates.io 0.7.0.
[target.'cfg(target_os = "linux")'.dependencies]
lotus-supervisor = { path = "../lotus-supervisor" }
servo = { version = "=0.7.0", default-features = false, features = ["js_jit", "clipboard", "webcrypto", "webgl", "media-gstreamer"] }
webgl = { package = "servo-webgl", path = "servo/components/webgl" }
servo_canvas_traits = { package = "servo-canvas-traits", path = "servo/components/shared/canvas" }
servo_base = { package = "servo-base", path = "servo/components/shared/base" }
paint_api = { package = "servo-paint-api", path = "servo/components/shared/paint" }
parking_lot = "0.12"
rustc-hash = "2"
winit = { version = "0.30", features = ["x11", "wayland"] }
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend", "desktop", "backend_egl", "xwayland"] }
drm-fourcc = "2.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
zvariant = "5"

[target.'cfg(target_os = "windows")'.dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["no-wgl", "js_jit", "clipboard", "webcrypto", "webgl", "media-gstreamer"] }
windows-sys = { version = "0.52", features = ["Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_Foundation"] }

[target.'cfg(not(any(target_os = "linux", target_os = "windows")))'.dependencies]
servo = { version = "=0.7.0", default-features = false, features = ["js_jit", "clipboard", "webcrypto", "webgl", "media-gstreamer"] }

[build-dependencies]
napi-build = "2"

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
debug = 1

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

# Game Mode: smithay's SHM drop-thread LazyLock unwrap()'d on EAGAIN and killed
# the nested compositor (navy host, dead Discord/game). Patched to retry.
#
# NOTE: On Linux, apply-servo-patch.sh also injects:
#   servo = { path = "servo/components/servo" }
# so the sandbox GPU broker / jail networking patch is used. Windows CI never
# runs that injection and builds stock crates.io Servo.
[patch.crates-io]
smithay = { path = "vendor/smithay" }
