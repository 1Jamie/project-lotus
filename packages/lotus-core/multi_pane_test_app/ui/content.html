<!DOCTYPE html>
<html>
<head>
    <style>
        :root { --bg: #020617; --surface: #0f172a; --accent: #3b82f6; --text: #f8fafc; --muted: #94a3b8; }
        body { 
            background: #020617; 
            color: #f8fafc; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 48px; 
            height: 100vh; 
            box-sizing: border-box; 
            border-top-right-radius: 20px;
            border-bottom-right-radius: 20px;
        }
        .card { background: #0f172a; padding: 32px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { font-family: sans-serif; color: #f8fafc; margin-top: 0; }
        p { color: #94a3b8; line-height: 1.6; }
        .info-tag { display: inline-block; padding: 4px 12px; background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="info-tag">Active View</div>
        <h1 id="view-title">Dashboard</h1>
        <p id="view-desc">Select an item from the sidebar to test IPC message routing.</p>
        <p>Try opening the terminal or command palette from the sidebar to see the native layout algorithm dynamically un-fill this pane in real-time, with zero IPC lag.</p>
        <div style="margin-top: 24px;">
            <label style="display:block; margin-bottom:8px; font-weight:600; color:#3b82f6;">Native &lt;select&gt; in Split Pane:</label>
            <select id="pane-select" style="background:#020617; color:#f8fafc; border:1px solid rgba(255,255,255,0.2); padding:8px 12px; border-radius:8px; font-size:14px; outline:none; cursor:pointer;" onchange="document.getElementById('pane-select-res').textContent = 'Selected: ' + this.value">
                <option value="dash">Dashboard View</option>
                <option value="analytics">Real-Time Analytics</option>
                <optgroup label="System Settings">
                    <option value="profile">User Profile</option>
                    <option value="security">Security & Keys</option>
                    <option value="notifications">Push Notifications</option>
                </optgroup>
                <optgroup label="Environments">
                    <option value="production">Production (AWS)</option>
                    <option value="staging">Staging (GCP)</option>
                    <option value="local">Local Development</option>
                </optgroup>
            </select>
            <span id="pane-select-res" style="margin-left: 12px; color: #94a3b8; font-size: 13px;"></span>
        </div>
    </div>

    <script>
        if (window.lotus) {
            window.lotus.on('update-view', (data) => {
                document.getElementById('view-title').textContent = data.view;
                document.getElementById('view-desc').textContent = `Successfully routed IPC message to switch view to ${data.view}.`;
            });
        }

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'p') {
                e.preventDefault();
                if (window.lotus) window.lotus.send('toggle-palette');
            }
        });
    </script>
</body>
</html>
