[package]
name = "lotus-engine"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "lotus-engine"
path = "src/main.rs"

[[example]]
name = "headless_spike"
path = "examples/headless_spike.rs"

[dependencies]
servo = { path = "../lotus-core/servo/components/servo", default-features = false, features = ["js_jit", "clipboard", "webcrypto", "webgpu", "bluetooth", "native-bluetooth", "gamepad", "media-gstreamer"] }
dpi = "0.1"
euclid = "0.22"
url = "2.5"
log = "0.4"
env_logger = "0.11.8"
image = "0.25"
lotus-supervisor = { path = "../lotus-supervisor" }
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user", "sched", "net", "signal", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

