[package]
name = "lotus-engine"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "lotus-engine"
path = "src/main.rs"

[[example]]
name = "headless_spike"
path = "examples/headless_spike.rs"

[dependencies]
servo = { version = "=0.7.0", default-features = false, features = [
    "js_jit",
    "clipboard",
    "webcrypto",
] }
dpi = "0.1"
euclid = "0.22"
url = "2.5"
log = "0.4"
env_logger = "0.11.8"
image = "0.25"
lotus-supervisor = { path = "../lotus-supervisor" }
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user", "sched", "net", "signal", "fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Dev Build Acceleration ---

# 1. Compile Servo, wgpu, and external deps with optimizations and strip their debug tables.
# Once cached, they run at full speed and don't dump gigabytes into the linker.
[profile.dev.package."*"]
opt-level = 2
debug = false

# 2. Local workspace crates compile fast with backtraces intact (line tables only).
[profile.dev]
opt-level = 0
debug = 1
codegen-units = 64
incremental = true

# 3. Fast iterative release profile
[profile.release]
lto = "thin"
codegen-units = 16
