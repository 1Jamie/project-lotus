[package]
name = "lotus-supervisor"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "lotus-supervisor"
path = "src/main.rs"

[[bin]]
name = "lotus-sandbox-probe"
path = "src/probe.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", default-features = false, features = ["user", "sched", "net", "signal", "fs", "process"] }
