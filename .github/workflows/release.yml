name: Release
env:
  DEBUG: napi:*
  APP_NAME: lotus
  MACOSX_DEPLOYMENT_TARGET: '10.13'
permissions:
  contents: write
  id-token: write
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: windows-latest
            setup: |
              choco install llvm nasm python311 pkgconfiglite --no-progress -y
              echo "LIBCLANG_PATH=C:/Program Files/LLVM/lib" >> $GITHUB_ENV
              echo "PYTHON=python" >> $GITHUB_ENV
              echo "AWS_LC_SYS_PREBUILT_NASM=1" >> $GITHUB_ENV
            build: |
              npm run build --workspace=@lotus-gui/core -- --target x86_64-pc-windows-msvc && npm run extract-angle --workspace=@lotus-gui/core
            target: x86_64-pc-windows-msvc
            build_id: x86_64-pc-windows-msvc
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_id: x86_64-unknown-linux-gnu
            setup: |
              export DEBIAN_FRONTEND=noninteractive
              sudo apt-get update
              # Azure mirror flakes are common; retry with --fix-missing before failing the job.
              for attempt in 1 2 3; do
                if sudo apt-get install -y --fix-missing \
                  libgl1-mesa-dev libssl-dev python3 libfontconfig1-dev dpkg-dev fakeroot rpm \
                  pkg-config libdbus-1-dev libxkbcommon-dev clang libclang-dev lld cmake \
                  libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                  libgstreamer-plugins-bad1.0-dev; then
                  break
                fi
                echo "apt install failed (attempt $attempt); refreshing mirrors and retrying..."
                sudo apt-get update || true
                if [[ "$attempt" -eq 3 ]]; then
                  exit 1
                fi
                sleep 15
              done
              sudo apt-get install -y libgstreamer-plugins-good1.0-dev \
                || sudo apt-get install -y libgstreamer-plugins-extra1.0-dev \
                || true
            build: |
              npm run build --workspace=@lotus-gui/core -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            build_id: x86_64-unknown-linux-suse
            setup: |
              docker pull opensuse/tumbleweed
            build: |
              printf '%s\n' \
                '#ifndef _GNU_SOURCE' \
                '#define _GNU_SOURCE 1' \
                '#endif' \
                '#include <stdlib.h>' \
                '#include <threads.h>' \
                '#include <pthread.h>' \
                '#define EMULATED_THREADS_H_INCLUDED_' \
                > /tmp/glslopt_compat.h
              # Build the CC shim on the host: generating it inside docker -c "..." breaks because
              # inner double-quotes (e.g. grep -Eq "...") terminate the outer -c string and | becomes a pipe.
              printf '%s\n' \
                '#!/usr/bin/env sh' \
                'cmdline="$*"' \
                'if printf %s "$cmdline" | grep -Eq "glsl-optimizer/|glslopt-"; then' \
                '  exec cc -include /tmp/glslopt_compat.h "$@"' \
                'else' \
                '  exec cc "$@"' \
                'fi' \
                > /tmp/cc-glslopt-shim
              chmod +x /tmp/cc-glslopt-shim
              docker run --rm -v $GITHUB_WORKSPACE:/workspace \
                -v /tmp/glslopt_compat.h:/tmp/glslopt_compat.h \
                -v /tmp/cc-glslopt-shim:/tmp/cc-glslopt-shim \
                -w /workspace opensuse/tumbleweed /bin/sh -c "
                set -e
                zypper --non-interactive refresh
                zypper --non-interactive install -y nodejs-npm gcc gcc-c++ fontconfig-devel Mesa-libGL-devel libopenssl-devel dbus-1-devel pkgconf-pkg-config python311 git gzip tar dpkg rpm-build zip unzip curl clang clang-devel lld cmake gstreamer-devel gstreamer-plugins-base-devel gstreamer-plugins-bad-devel
                curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
                export PATH=\"\$HOME/.cargo/bin:\$PATH\"
                export CC=/tmp/cc-glslopt-shim
                git config --global --add safe.directory '*'
                git config --global gitoxide.objects.allocLimitIfReducedTrust 0
                bash scripts/apply-servo-patch.sh
                npm install
                npm run build --workspace=@lotus-gui/core -- --target x86_64-unknown-linux-gnu
                mv packages/lotus-core/lotus.linux-x64-gnu.node packages/lotus-core/lotus.linux-x64-suse.node
                mv packages/lotus-core/bindings-x86_64-unknown-linux-gnu packages/lotus-core/bindings-x86_64-unknown-linux-suse 2>/dev/null || true
              "
    name: stable - ${{ matrix.settings.build_id }} - node@20
    runs-on: ${{ matrix.settings.host }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force
        shell: powershell
      - uses: actions/checkout@v4
        with:
          # Submodule is required on all hosts: Cargo validates linux-only path deps
          # even when building for Windows. Windows still uses crates.io Servo (no
          # apply-servo-patch injection); Linux redirects via [patch.crates-io].
          submodules: true
      # MSVC/mozangle still hit legacy MAX_PATH under deep GitHub workspaces (e.g. packages/lotus-core/target/...).
      - name: Short Cargo and temp dirs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "/d/t" "/d/tmp"
          echo "CARGO_TARGET_DIR=D:/t" >> "$GITHUB_ENV"
          echo "TMP=D:/tmp" >> "$GITHUB_ENV"
          echo "TEMP=D:/tmp" >> "$GITHUB_ENV"
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 20
          cache: npm
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
            ${{ runner.os == 'Windows' && 'D:/t' || '' }}
          key: ${{ matrix.settings.build_id }}-cargo-${{ matrix.settings.host }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.11.0
      - name: Setup GStreamer (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gstVer = "1.24.13"
          $gstBase = "https://gstreamer.freedesktop.org/data/pkg/windows/$gstVer/msvc"
          $ua = "chocolatey command line"
          # Full devel MSI is ~690MB+; truncated downloads previously passed a weak 50MB check.
          $minDevelBytes = 500MB
          Write-Host "Installing GStreamer $gstVer runtime via choco..."
          choco install gstreamer --version $gstVer --no-progress -y
          $gstRoot = [System.Environment]::GetEnvironmentVariable("GSTREAMER_1_0_ROOT_MSVC_X86_64", "Machine")
          if (-not $gstRoot) { $gstRoot = "D:\gstreamer\1.0\msvc_x86_64" }
          $gstRoot = $gstRoot.TrimEnd('\')
          Write-Host "GStreamer runtime root: $gstRoot"
          $devel = Join-Path $env:TEMP "gstreamer-devel.msi"
          $develUrl = "$gstBase/gstreamer-1.0-devel-msvc-x86_64-$gstVer.msi"
          $ok = $false
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            Write-Host "Downloading GStreamer $gstVer devel MSI (attempt $attempt/4)..."
            Remove-Item -LiteralPath $devel -Force -ErrorAction SilentlyContinue
            & curl.exe -fL --retry 5 --retry-all-errors --retry-delay 5 `
              --connect-timeout 30 --max-time 900 `
              --user-agent $ua -o $devel $develUrl
            if ($LASTEXITCODE -ne 0) {
              Write-Host "curl failed with exit $LASTEXITCODE"
              Start-Sleep -Seconds (10 * $attempt)
              continue
            }
            $develSize = (Get-Item -LiteralPath $devel).Length
            Write-Host "Devel MSI size: $develSize bytes"
            if ($develSize -lt $minDevelBytes) {
              Write-Host "Devel MSI too small (need >= $minDevelBytes); retrying..."
              Start-Sleep -Seconds (10 * $attempt)
              continue
            }
            $ok = $true
            break
          }
          if (-not $ok) {
            throw "Failed to download a complete GStreamer devel MSI after retries"
          }
          $installDir = Split-Path (Split-Path $gstRoot -Parent) -Parent
          Write-Host "Installing GStreamer devel to $installDir ..."
          $proc = Start-Process -FilePath "msiexec.exe" -ArgumentList @(
            "/i", $devel,
            "/qn",
            ("TARGETDIR=" + $installDir)
          ) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "msiexec failed with exit code $($proc.ExitCode)" }
          Write-Host "GStreamer devel installed successfully."
          $glibPc = Join-Path $gstRoot "lib\pkgconfig\glib-2.0.pc"
          if (-not (Test-Path -LiteralPath $glibPc)) {
            throw "GStreamer devel install missing $glibPc"
          }
          # pkg-config treats ':' as a path separator, so "D:/..." becomes ["D","/..."].
          # Use an MSYS-style /D/... path that has no drive colon.
          $pkgConfigPath = (($gstRoot + "\lib\pkgconfig") -replace '\\', '/') -replace '^([A-Za-z]):', '/$1'
          echo "GSTREAMER_1_0_ROOT_MSVC_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "GSTREAMER_1_0_ROOT_X86_64=$gstRoot" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=$pkgConfigPath" >> $env:GITHUB_ENV
          echo "$gstRoot\bin" >> $env:GITHUB_PATH
          Write-Host "PKG_CONFIG_PATH set to: $pkgConfigPath"
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Install dependencies
        run: npm install
      - name: Build
        run: ${{ matrix.settings.build }}
        shell: bash
      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.build_id }}
          path: |
            packages/lotus-core/*.node
            packages/lotus-core/index.js
            packages/lotus-core/index.d.ts
            packages/lotus-core/windows/*.dll
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Move artifacts
        run: |
          npm run artifacts --workspace=@lotus-gui/core
        continue-on-error: true # Just in case script missing, but we handle via direct move
      # Manually move artifacts to core
      - name: Distribute artifacts
        run: |
          ls -R artifacts
          find artifacts -name "*.node" -exec cp -v {} packages/lotus-core/ \;
          mkdir -p packages/lotus-core/windows
          find artifacts -name "*.dll" -exec cp -v {} packages/lotus-core/windows/ \; 2>/dev/null || true
          find artifacts -name "index.js" -exec cp -v {} packages/lotus-core/ \;
          find artifacts -name "index.d.ts" -exec cp -v {} packages/lotus-core/ \;
          ls -la packages/lotus-core/
      - name: Publish to npm
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
          CORE_VER=$(node -p "require('./packages/lotus-core/package.json').version")
          DEV_VER=$(node -p "require('./packages/lotus-dev/package.json').version")
          if [[ "$CORE_VER" == *"-devel"* ]]; then
            TAG=devel
            echo "Devel release detected (@lotus-gui/core@$CORE_VER) — publishing with --tag devel"
            npm publish --workspace=@lotus-gui/core --access public --tag "$TAG"
            # Skip @lotus-gui/dev unless this exact version is not on the registry yet
            # (devel cuts often only bump core).
            if npm view "@lotus-gui/dev@${DEV_VER}" version >/dev/null 2>&1; then
              echo "@lotus-gui/dev@${DEV_VER} already published — skipping"
            else
              echo "Publishing @lotus-gui/dev@${DEV_VER} with --tag devel"
              npm publish --workspace=@lotus-gui/dev --access public --tag "$TAG"
            fi
          else
            echo "Stable release (@lotus-gui/core@$CORE_VER) — publishing with default latest tag"
            npm publish --workspace=@lotus-gui/core --access public
            npm publish --workspace=@lotus-gui/dev --access public
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: packages/lotus-core/*.node
          prerelease: ${{ contains(github.ref_name, 'devel') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
